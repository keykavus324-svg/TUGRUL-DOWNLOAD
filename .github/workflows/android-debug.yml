name: Android debug APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Android runner image already includes the SDK and licenses.
      - name: Build debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleGithubDebug --no-daemon 2>&1 | tee gradle-output.log || {
            while IFS= read -r line; do
              echo "::error::${line//'%'/'%25'}"
            done < <(tail -80 gradle-output.log)
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tugrul-download-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
