name: GitHub Pages (statik demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # gh-pages dalını güncelleyebilmek için

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.detect.outputs.build_type }}
    steps:
      - name: Pages kaynağını algıla (workflow | legacy)
        id: detect
        run: |
          set +e
          BT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pages" \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('build_type','none'))" 2>/dev/null)
          echo "Pages build_type = ${BT:-none}"
          echo "build_type=${BT:-none}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Tip kontrolü
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Çevrimdışı motor duman testi (motor + 10 sayfa)
        working-directory: frontend
        run: node offline-render.mjs

      - name: Statik derleme (çevrimdışı motor)
        working-directory: frontend
        run: npx vite build --mode ghpages

      - name: SPA yönlendirme + işaretçi
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          {
            echo "/** GitHub Pages · sunucusuz çevrimdışı motor **/"
            echo "/* demo medya: sayfa önbelleğine alınmasın */"
            echo "/*.mp4"
            echo "/*.mp3"
          } > frontend/dist/robots.txt
          ls -la frontend/dist

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: gh-pages dalını da güncelle (dal tabanlı yayın için)
        continue-on-error: true
        run: |
          cd frontend/dist
          touch .nojekyll
          git init -q -b gh-pages .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages

  # Actions'tan Pages'e yayın (Pages kaynağı "GitHub Actions" ise çalışır).
  # Pages henüz etkin değilse atlanır; alternatif `gh-pages` dalı ve
  # docs/YAYIN.md içindeki tek adımlık ayar kullanılabilir.
  deploy:
    needs: build
    # Yalnızca Pages kaynağı "GitHub Actions" iken yayınla.
    # Kaynak "gh-pages" dalı ise GitHub'ın kendi yayın işi devrede.
    if: needs.build.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
