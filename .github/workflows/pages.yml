name: GitHub Pages (statik demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Tip kontrolü
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Statik derleme (çevrimdışı motor)
        working-directory: frontend
        run: npx vite build --mode ghpages

      - name: SPA yönlendirme + işaretçi
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          {
            echo "/** GitHub Pages · sunucusuz çevrimdışı motor **/"
            echo "/* demo medya: sayfa önbelleğine alınmasın */"
            echo "/*.mp4"
            echo "/*.mp3"
          } > frontend/dist/robots.txt
          ls -la frontend/dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
